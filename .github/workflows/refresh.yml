name: 每日刷新爆款数据

on:
  schedule:
    # 每 8 小时刷新一次（北京时间 08:00 / 16:00 / 00:00）
    - cron: "0 */8 * * *"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write        # 允许 Action 把 daily.json 提交回仓库

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 daily.json
        env:
          AI_PRODUCT_TOKEN: ${{ secrets.AI_PRODUCT_TOKEN }}
        run: python gen_daily.py

      - name: 构建 index.html（内联 app.js + daily.json）
        run: python build.py

      - name: 提交更新
        run: |
          git config user.name "yu-workbench-bot"
          git config user.email "bot@yu-workbench.local"
          git add daily.json index.html archive.json
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 每日爆款数据自动更新 $(date +'%Y-%m-%d')"
            git pull --rebase --no-edit origin main
            git push
          fi
