name: 每日刷新爆款数据

on:
  schedule:
    # 每 8 小时由 GitHub 云端自动运行（北京时间 08:00 / 16:00 / 00:00），无需本地电脑开机
    - cron: "0 */8 * * *"
  workflow_dispatch: {}   # 允许手动触发

permissions:
  contents: write   # 用 GITHUB_TOKEN 直接提交回 main 分支（Pages 源），无需任何私人 PAT

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 daily.json / archive.json / history/ 分日归档（新闻/选题/二创/半年历史）
        env:
          AI_PRODUCT_TOKEN: ${{ secrets.AI_PRODUCT_TOKEN }}
        run: python gen_daily.py

      - name: 构建 index.html（内联 app.js + daily.json）
        run: python build.py

      - name: 提交并推送到 GitHub Pages 源（main 分支）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -f history.json 2>/dev/null || true; git add index.html sw.js app.js template.html daily.json archive.json aiproduct_real.json manifest.webmanifest icon.svg history
          if git diff --cached --quiet; then
            echo "✅ 无内容变更，跳过提交"
          else
            git commit -m "chore: 每日自动刷新 $(TZ=Asia/Shanghai date +%F_%H:%M)"
            git pull --rebase --autostash
            git push
            echo "✅ 已推送，GitHub Pages 将在 1-2 分钟内重建"
          fi
