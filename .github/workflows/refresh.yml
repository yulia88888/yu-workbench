name: 每日刷新爆款数据

on:
  schedule:
    # 每 8 小时刷新一次（北京时间 08:00 / 16:00 / 00:00），完全服务端运行，不依赖本地/账号配额
    - cron: "0 */8 * * *"
  workflow_dispatch: {}   # 允许手动触发

# 部署由 deploy_py.py 用自带 token 走 Contents API 完成，GITHUB_TOKEN 只需读权限
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成 daily.json / archive.json / history.json
        env:
          AI_PRODUCT_TOKEN: ${{ secrets.AI_PRODUCT_TOKEN }}
        run: python gen_daily.py

      - name: 构建 index.html（内联 app.js + daily.json）
        run: python build.py

      - name: 部署到 GitHub Pages（推送 11 个文件，含当天生成的数据）
        run: python deploy_py.py
