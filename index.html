<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#6B8E42" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <title>瑜的工作台</title>

  <style>
    :root{
      --bg:#F7F5EF;
      --card:#FFFFFF;
      --primary:#6B8E42;
      --primary-dark:#4A632D;
      --primary-light:#EDF2E5;
      --primary-soft:#F4F7EF;
      --text:#2C3E2D;
      --text-secondary:#5E6B5F;
      --text-tertiary:#909E91;
      --border:#E0E8D5;
      --heat:#F5A623;
      --info-bg:#F6F8F2;
      --shadow:0 2px 10px rgba(107,142,66,.08);
      --radius:16px;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;margin:0;overscroll-behavior:none;}
    body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent;}
    button{font:inherit;color:inherit;cursor:pointer;background:none;border:none;padding:0;}
    a{text-decoration:none;color:inherit;}
    textarea,input,select{font-size:16px;font-family:inherit;}

    .app{display:flex;height:100vh;height:100dvh;width:100vw;max-width:480px;margin:0 auto;overflow:hidden;background:var(--bg);}
    .sidebar{width:76px;flex-shrink:0;background:linear-gradient(180deg,var(--primary) 0%,var(--primary-dark) 100%);display:flex;flex-direction:column;align-items:center;padding:16px 8px 12px;gap:10px;}
    .sidebar-logo{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;font-weight:700;margin-bottom:4px;}
    .nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;flex:1;border-radius:14px;color:rgba(255,255,255,.88);font-size:11px;font-weight:500;gap:4px;transition:all .15s ease;}
    .nav-btn.active{background:#fff;color:var(--primary-dark);box-shadow:0 4px 14px rgba(0,0,0,.14);}
    .nav-btn span:first-child{font-size:22px;line-height:1;}
    .main{flex:1;min-width:0;display:flex;flex-direction:column;}

    .topbar{flex-shrink:0;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);position:relative;z-index:10;}
    .topbar-title{font-size:18px;font-weight:700;color:var(--text);letter-spacing:-.2px;}
    .topbar-date{font-size:12px;color:var(--text-tertiary);white-space:nowrap;}

    .content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 12px 20px;scrollbar-width:none;-ms-overflow-style:none;}
    .content::-webkit-scrollbar{display:none;}

    .filter-bar{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 10px;scrollbar-width:none;-ms-overflow-style:none;}
    .filter-bar::-webkit-scrollbar{display:none;}
    .filter-chip{flex-shrink:0;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--border);background:#fff;color:var(--text-secondary);transition:all .15s;}
    .filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}

    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;animation:pop .22s ease;}
    @keyframes pop{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

    .tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--primary);color:var(--primary);background:rgba(107,142,66,.06);}

    .btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--primary);color:#fff;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;box-shadow:0 3px 8px rgba(107,142,66,.25);transition:all .15s;}
    .btn-primary:active{transform:scale(.97);box-shadow:0 1px 4px rgba(107,142,66,.2);}
    .btn-outline{display:inline-flex;align-items:center;justify-content:center;gap:4px;background:#fff;border:1px solid var(--border);color:var(--text-secondary);font-size:12px;font-weight:500;padding:7px 12px;border-radius:999px;transition:all .15s;}
    .btn-outline:active{transform:scale(.97);background:var(--primary-soft);}

    .topic-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;}
    .topic-number{flex-shrink:0;font-size:20px;font-weight:800;color:var(--primary);line-height:1.1;margin-top:1px;}
    .topic-title-wrap{flex:1;min-width:0;}
    .topic-title{font-size:16px;font-weight:700;color:var(--text);line-height:1.35;}
    .topic-analysis{font-size:13px;color:var(--text-secondary);line-height:1.65;margin-bottom:12px;}
    .topic-actions{display:flex;gap:10px;}
    .topic-actions .btn-primary{flex:1;}
    .topic-actions .btn-outline{flex:1;color:var(--primary);border-color:var(--primary);}

    .repost-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
    .repost-title{font-size:17px;font-weight:700;color:var(--text);line-height:1.35;flex:1;min-width:0;}
    .repost-heat{flex-shrink:0;display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--heat);white-space:nowrap;margin-top:2px;}
    .repost-section{margin-bottom:10px;}
    .repost-label{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:3px;}
    .repost-text{font-size:13px;color:var(--text-secondary);line-height:1.65;}
    .repost-source{font-size:11px;color:var(--text-tertiary);margin:10px 0 12px;}
    .repost-cta{margin-bottom:12px;}
    .repost-info{background:var(--info-bg);border-radius:12px;padding:12px;display:flex;gap:8px;margin-bottom:14px;}
    .repost-info-icon{flex-shrink:0;font-size:16px;}
    .repost-info-text{flex:1;font-size:12px;color:var(--text-secondary);line-height:1.6;}
    .repost-info-text b{color:var(--primary);font-weight:700;}
    .repost-footer{display:flex;gap:8px;}
    .repost-footer .btn-outline{flex:1;padding:8px 4px;font-size:12px;}

    .plan-progress-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
    .plan-progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .plan-progress-top span:first-child{font-size:14px;font-weight:600;color:var(--text);}
    .plan-progress-top span:last-child{font-size:14px;font-weight:700;color:var(--primary);}
    .plan-progress-bar{height:8px;border-radius:999px;background:var(--primary-light);overflow:hidden;}
    .plan-progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-dark));border-radius:999px;transition:width .3s ease;}
    .task-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;animation:pop .22s ease;}
    .task-check{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:all .15s;}
    .task-check.done{background:var(--primary);border-color:var(--primary);}
    .task-check svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;}
    .task-text{flex:1;font-size:14px;color:var(--text);}
    .task-text.done{text-decoration:line-through;color:var(--text-tertiary);}
    .task-del{flex-shrink:0;color:var(--text-tertiary);font-size:16px;padding:4px;}
    .plan-add{display:flex;gap:8px;margin-top:12px;}
    .plan-add input{flex:1;border:1px solid var(--border);border-radius:12px;padding:11px 14px;font-size:14px;background:#fff;outline:none;}
    .plan-add input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
    .plan-add button{background:var(--primary);color:#fff;border-radius:12px;padding:0 18px;font-size:14px;font-weight:600;}
    .plan-tip{font-size:11px;color:var(--text-tertiary);margin-top:10px;line-height:1.5;}

    .review-form{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
    .review-form label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:12px;}
    .review-form input,.review-form select,.review-form textarea{width:100%;margin-top:6px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;background:#fff;outline:none;}
    .review-form input:focus,.review-form select:focus,.review-form textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
    .review-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
    .review-submit{width:100%;background:var(--primary);color:#fff;border-radius:12px;padding:12px;font-size:15px;font-weight:700;margin-top:4px;}
    .review-item{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;}
    .review-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .review-item-title{font-size:15px;font-weight:700;color:var(--text);}
    .review-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;}
    .metric{background:var(--primary-soft);border-radius:10px;padding:8px 4px;text-align:center;}
    .metric-label{font-size:10px;color:var(--text-tertiary);}
    .metric-val{font-size:13px;font-weight:700;color:var(--text);margin-top:2px;}
    .review-tips{border-top:1px solid var(--border);padding-top:10px;margin-top:10px;}
    .review-tips p{font-size:12px;color:var(--text-secondary);line-height:1.6;margin:0 0 6px;}

    .sheet{position:fixed;inset:0;z-index:50;display:none;}
    .sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.4);}
    .sheet-body{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:16px 16px 24px;max-height:85%;overflow-y:auto;}
    .sheet-handle{width:40px;height:5px;background:var(--border);border-radius:999px;margin:0 auto 14px;}
    .sheet-title{font-size:17px;font-weight:700;color:var(--text);margin-bottom:14px;}
    .sheet-field{margin-bottom:12px;}
    .sheet-field label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:5px;}
    .sheet-field input,.sheet-field select,.sheet-field textarea{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:14px;outline:none;}
    .sheet-field input:focus,.sheet-field select:focus,.sheet-field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
    .sheet-save{width:100%;background:var(--primary);color:#fff;border-radius:12px;padding:12px;font-size:15px;font-weight:700;margin-top:6px;}

    .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:rgba(44,62,45,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.18);display:none;animation:toastIn .25s ease;}
    @keyframes toastIn{from{opacity:0;transform:translate(-50%,12px);}to{opacity:1;transform:translate(-50%,0);}}

    .hidden{display:none!important;}
    .empty{text-align:center;padding:40px 20px;color:var(--text-tertiary);font-size:14px;}
  </style>
</head>
<body>

  <div class="app">
    <nav class="sidebar">
      <div class="sidebar-logo">瑜</div>
      <button data-view="plan" class="nav-btn active"><span>📋</span><span>每日计划</span></button>
      <button data-view="topic" class="nav-btn"><span>💡</span><span>选题灵感</span></button>
      <button data-view="repost" class="nav-btn"><span>🔥</span><span>爆款二创</span></button>
      <button data-view="review" class="nav-btn"><span>📊</span><span>内容复盘</span></button>
    </nav>

    <main class="main">
      <header class="topbar">
        <h1 class="topbar-title" id="viewTitle">每日计划</h1>
        <span class="topbar-date" id="todayDate"></span>
      </header>

      <section class="content" id="content">

        <div data-panel="plan">
          <div class="plan-progress-card">
            <div class="plan-progress-top"><span>今日完成度</span><span id="planCount">0/0</span></div>
            <div class="plan-progress-bar"><div id="planBar" class="plan-progress-fill" style="width:0%"></div></div>
          </div>
          <ul id="taskList"></ul>
          <div class="plan-add">
            <input id="taskInput" type="text" placeholder="添加新任务，回车确认…" />
            <button id="taskAdd">添加</button>
          </div>
          <p class="plan-tip">提示：每天 0 点后任务会自动重置为未完成，任务清单本身长期保留。完成后点圆圈打勾即可。</p>
        </div>

        <div data-panel="topic" class="hidden">
          <div id="topicFilter" class="filter-bar"></div>
          <div id="topicList"></div>
          <button id="topicAddBtn" class="btn-outline" style="width:100%;margin-top:8px;padding:10px;">＋ 新增一条选题</button>
          <button id="topicImportBtn" class="btn-primary" style="width:100%;margin-top:10px;">📥 粘贴导入今日采集（JSON）</button>
          <p class="plan-tip">每日自动采集各平台赛道爆款，逐条分析火爆原因并给出原创创作思路。抖音/小红书/快手因官方未开放单条视频接口，点击按钮进入平台相关视频流；B站/微博可跳转真实视频或话题页。</p>
        </div>

        <div data-panel="repost" class="hidden">
          <div id="repostFilter" class="filter-bar"></div>
          <div id="repostList"></div>
          <button id="repostAddBtn" class="btn-outline" style="width:100%;margin-top:8px;padding:10px;">＋ 新增二创素材</button>
          <button id="repostImportBtn" class="btn-primary" style="width:100%;margin-top:10px;">📥 粘贴导入今日采集（JSON）</button>
          <p class="plan-tip">全网最新热点爆款，按女性成长、穿搭、妆教、敏感肌、vlog 等方向筛选，逐条给出详细二创改编方案。点击绿色按钮进入对应平台查看真实视频/话题流。</p>
        </div>

        <div data-panel="review" class="hidden">
          <form id="reviewForm" class="review-form">
            <div class="review-grid">
              <label>平台<select name="platform"><option>抖音</option><option>小红书</option><option>快手</option><option>微博</option><option>B站</option></select></label>
              <label>流量来源<select name="source"><option>推荐</option><option>关注</option><option>搜索</option><option>其他</option></select></label>
              <label>赞播比<input name="lkrate" type="text" readonly placeholder="自动" /></label>
            </div>
            <label>选题 / 标题<input name="title" required placeholder="如：通勤伪素颜妆" /></label>
            <div class="review-grid">
              <label>播放量<input name="views" type="number" min="0" placeholder="0" /></label>
              <label>点赞<input name="likes" type="number" min="0" placeholder="0" /></label>
              <label>评论<input name="comments" type="number" min="0" placeholder="0" /></label>
              <label>转发<input name="shares" type="number" min="0" placeholder="0" /></label>
              <label>完播率(%)<input name="finish" type="number" min="0" max="100" placeholder="0" /></label>
              <label>日期<input name="rdate" type="date" /></label>
            </div>
            <label>做得好的点（选填）<textarea name="good" rows="2" placeholder="这次哪里表现不错"></textarea></label>
            <label>下次优化点（选填）<textarea name="improve" rows="2" placeholder="下次想改的地方"></textarea></label>
            <button type="submit" class="review-submit">保存并智能诊断</button>
          </form>
          <h3 style="font-size:15px;font-weight:700;color:var(--text);margin:18px 4px 10px;">历史复盘（永久存档）</h3>
          <div id="reviewList"></div>
        </div>

      </section>
    </main>
  </div>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-back" data-close></div>
    <div class="sheet-body">
      <div class="sheet-handle"></div>
      <h3 id="sheetTitle" class="sheet-title">新增</h3>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
(function () {
  'use strict';

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const todayKey = () => new Date().toISOString().slice(0, 10);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const LS = {
    tasks: 'yu_tasks',
    done: 'yu_done',
    user_topics: 'yu_user_topics_v2',
    user_reposts: 'yu_user_reposts_v2',
    reviews: 'yu_reviews',
    daily: 'yu_daily',
    hidden: 'yu_hidden'
  };

  const load = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? def; } catch { return def; } };
  const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

  const PLATFORMS = ['抖音', '小红书', '快手', '微博', 'B站'];
  const CATS = ['化妆', '护肤', '穿搭', '拍照', '职场', '唱歌', '身材', '变美vlog'];

  /* ---------- Toast / Copy ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.style.display = 'block';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.style.display = 'none', 2200);
  }
  async function copyLink(url) {
    if (!url) return;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(url);
      } else {
        const ta = document.createElement('textarea');
        ta.value = url; ta.style.position = 'fixed'; ta.style.top = '-9999px'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.focus(); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      }
      toast('✅ 链接已复制');
    } catch (e) {
      toast('复制失败，请长按链接手动复制');
    }
  }

  /* ---------- 每日计划 ---------- */
  let tasks = load(LS.tasks, [
    { id: uid(), text: '🏃 运动', fixed: true },
    { id: uid(), text: '😴 10:50 提醒睡觉', fixed: true }
  ]);
  let doneMap = load(LS.done, {});
  let doneToday = doneMap[todayKey()] || {};

  function renderPlan() {
    const list = $('#taskList');
    list.innerHTML = '';
    tasks.forEach(t => {
      const ok = !!doneToday[t.id];
      const li = document.createElement('li');
      li.className = 'task-item';
      li.innerHTML = `
        <button data-toggle="${t.id}" class="task-check ${ok ? 'done' : ''}">
          ${ok ? '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 6"/></svg>' : ''}
        </button>
        <span class="task-text ${ok ? 'done' : ''}">${esc(t.text)}</span>
        ${t.fixed ? '' : `<button data-del="${t.id}" class="task-del">✕</button>`}`;
      list.appendChild(li);
    });
    const total = tasks.length, done = tasks.filter(t => doneToday[t.id]).length;
    $('#planCount').textContent = done + '/' + total;
    $('#planBar').style.width = (total ? Math.round(done / total * 100) : 0) + '%';
    save(LS.done, doneMap);
  }
  $('#taskList').addEventListener('click', e => {
    const tg = e.target.closest('[data-toggle]');
    const dl = e.target.closest('[data-del]');
    if (tg) {
      const id = tg.dataset.toggle;
      doneToday[id] = !doneToday[id];
      doneMap[todayKey()] = doneToday;
      renderPlan();
    }
    if (dl) {
      const id = dl.dataset.del;
      tasks = tasks.filter(t => t.id !== id);
      delete doneToday[id];
      save(LS.tasks, tasks);
      renderPlan();
    }
  });
  function addTask(text) {
    text = text.trim();
    if (!text) return;
    tasks.push({ id: uid(), text });
    save(LS.tasks, tasks);
    renderPlan();
  }
  $('#taskAdd').addEventListener('click', () => { addTask($('#taskInput').value); $('#taskInput').value = ''; });
  $('#taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') { addTask($('#taskInput').value); $('#taskInput').value = ''; } });
  if (!doneMap[todayKey()]) { doneMap[todayKey()] = {}; doneToday = doneMap[todayKey()]; }
  renderPlan();

  /* ---------- 选题灵感 ---------- */

  function allReposts() {
    const u = userReposts.map(t => ({ ...t }));
    const d = daily.reposts.filter(t => !hidden.includes(t.id)).map(t => ({ ...t }));
    return [...u, ...d];
  }
  function renderReposts() {
    const list = allReposts().filter(t => repostFilter === '全部' || t.platform === repostFilter);
    if (!list.length) {
      repostListEl.innerHTML = '<div class="empty">暂无素材，点下方「＋新增」添加</div>';
      return;
    }
    repostListEl.innerHTML = list.map(repostCard).join('');
  }
  function repostCard(t) {
    const tag = t.tag ? `<span class="tag">${esc(t.tag)}</span>` : '';
    return `<div class="card repost-card">
      <div class="repost-header">
        <div class="repost-title">${esc(t.title)} ${tag}</div>
        <div class="repost-heat">🔥 ${esc(t.heat)}</div>
      </div>
      <div class="repost-section">
        <div class="repost-label">为什么适合你二创：</div>
        <div class="repost-text">${esc(t.why_fit)}</div>
      </div>
      <div class="repost-section">
        <div class="repost-label">改编角度：</div>
        <div class="repost-text">${esc(t.adapt_angle)}</div>
      </div>
      <div class="repost-source">来源：${esc(t.source)}</div>
      <div class="repost-cta">
        <a href="${esc(t.link || '#')}" target="_blank" rel="noopener" class="btn-primary">▶ 去${esc(t.platform)}看真实视频（点开即看）</a>
      </div>
      <div class="repost-info">
        <div class="repost-info-icon">🎬</div>
        <div class="repost-info-text"><b>这个视频长这样：</b>${esc(t.video_desc)}</div>
      </div>
      <div class="repost-footer">
        <button data-addtask="${esc(t.title)}" class="btn-outline">＋ 加入任务</button>
        <button data-saveinsp="${esc(t.id)}" class="btn-outline">⭐ 存为灵感</button>
        <button data-hide="${esc(t.id)}" class="btn-outline">🔄 换视频</button>
      </div>
      <div style="margin-top:10px;">
        <button data-copy="${esc(t.link || '')}" class="btn-outline" style="width:100%;font-size:11px;">📋 复制链接</button>
      </div>
    </div>`;
  }
  repostFilterEl.addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    repostFilter = b.dataset.f; renderRepostFilter(); renderReposts();
  });
  repostListEl.addEventListener('click', e => {
    const c = e.target.closest('[data-copy]');
    if (c) { copyLink(c.dataset.copy); return; }
    const add = e.target.closest('[data-addtask]');
    if (add) { tasks.push({ id: uid(), text: '🎬 二创：' + add.dataset.addtask }); save(LS.tasks, tasks); renderPlan(); toast('已加入任务'); return; }
    const sv = e.target.closest('[data-saveinsp]');
    if (sv) { toast('已存为灵感（可在本地收藏查看）'); return; }
    const hd = e.target.closest('[data-hide]');
    if (hd) {
      const id = hd.dataset.hide;
      if (daily.reposts.some(t => t.id === id)) {
        if (!hidden.includes(id)) hidden.push(id); save(LS.hidden, hidden);
      } else {
        userReposts = userReposts.filter(t => t.id !== id); save(LS.user_reposts, userReposts);
      }
      renderReposts(); return;
    }
  });
  $('#repostAddBtn').addEventListener('click', () => openSheet('二创素材', buildRepostForm()));

  /* ---------- 内容复盘 ---------- */
  let reviews = load(LS.reviews, []);
  const reviewListEl = $('#reviewList');

  function diagnose(d) {
    const out = [];
    const views = +d.views || 0, likes = +d.likes || 0, comments = +d.comments || 0,
          shares = +d.shares || 0, finish = +d.finish || 0;
    const lkRate = views ? (likes / views * 100) : 0;

    if (views > 0 && finish > 0 && finish < 30)
      out.push('📉 完播率仅 ' + finish + '%，偏低 → 前 3 秒必须前置钩子：把最大反差/结果/冲突放开头，配大字标题，节奏前快后稳。');
    if (views > 0 && comments < likes * 0.02)
      out.push('💬 评论偏少 → 结尾主动抛互动问题（如「你是宽肩还是窄肩？」「求链接打 1」），并在评论区自己先留一条引导。');
    if (views > 0 && lkRate < 3)
      out.push('❤️ 赞播比仅 ' + lkRate.toFixed(1) + '% → 选题或封面标题吸引力不足，建议测试更情绪化/更具体的标题，封面用「对比图+大字」。');
    if (views > 0 && shares < likes * 0.05)
      out.push('🔁 转发低 → 缺「可收藏实用价值」，建议加干货清单、金句截图点或「抄作业」式步骤，提升转发动机。');
    if (d.source === '推荐' && views < 500)
      out.push('🚀 推荐流量弱 → 话题标签不精准或账号权重低，优化 3-5 个垂直话题词，固定黄金发布时段（19-22 点）培养习惯。');
    if (views > 0 && views < 200)
      out.push('🔍 整体播放低 → 检查发布时间、首波互动（发后 1 小时内自己点赞评论引动），并考虑蹭当日热点二创。');

    if (!out.length) out.push('✅ 数据表现均衡，继续保持当前节奏，可尝试在稳定选题上做微创新（换钩子/换封面）测试天花板。');
    return out;
  }

  $('#reviewForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target;
    const d = {
      id: uid(), date: f.rdate.value || todayKey(),
      platform: f.platform.value, source: f.source.value, title: f.title.value.trim(),
      views: f.views.value, likes: f.likes.value, comments: f.comments.value,
      shares: f.shares.value, finish: f.finish.value, good: f.good.value.trim(), improve: f.improve.value.trim()
    };
    d.tips = diagnose(d);
    reviews.unshift(d);
    save(LS.reviews, reviews);
    f.reset();
    renderReviews();
    toast('已保存 · ' + d.tips.length + ' 条优化建议');
  });

  function renderReviews() {
    if (!reviews.length) { reviewListEl.innerHTML = '<div class="empty">还没有复盘记录，发完作品来填一单吧</div>'; return; }
    reviewListEl.innerHTML = reviews.map(r => `
      <div class="review-item">
        <div class="review-item-top">
          <span class="tag">${esc(r.platform)}</span>
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:11px;color:var(--text-tertiary);">${esc(r.date)}</span>
            <button data-rreview="${r.id}" style="color:var(--text-tertiary);font-size:13px;">删除</button>
          </div>
        </div>
        <div class="review-item-title">${esc(r.title)}</div>
        <div class="review-metrics">
          ${metric('播放', r.views)} ${metric('点赞', r.likes)} ${metric('评论', r.comments)}
          ${metric('转发', r.shares)} ${metric('完播', r.finish + '%')} ${metric('来源', r.source)}
        </div>
        ${r.good ? `<p style="font-size:12px;color:var(--text-secondary);margin:8px 0 0;"><b style="color:var(--primary);">👍 亮点：</b>${esc(r.good)}</p>` : ''}
        ${r.improve ? `<p style="font-size:12px;color:var(--text-secondary);margin:6px 0 0;"><b style="color:var(--primary);">🔧 待改：</b>${esc(r.improve)}</p>` : ''}
        <div class="review-tips">
          ${(r.tips || []).map(t => `<p>${esc(t)}</p>`).join('')}
        </div>
      </div>`).join('');
  }
  function metric(label, val) {
    return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-val">${esc(val || 0)}</div></div>`;
  }
  reviewListEl.addEventListener('click', e => {
    const b = e.target.closest('[data-rreview]'); if (!b) return;
    reviews = reviews.filter(r => r.id !== b.dataset.rreview); save(LS.reviews, reviews); renderReviews();
  });
  renderReviews();

  $('#reviewForm').addEventListener('input', e => {
    if (e.target.name === 'views' || e.target.name === 'likes') {
      const v = +e.target.form.views.value || 0, l = +e.target.form.likes.value || 0;
      e.target.form.lkrate.value = v ? (l / v * 100).toFixed(1) + '%' : '';
    }
  });

  /* ---------- 弹层 ---------- */
  const sheet = $('#sheet'), sheetBody = $('#sheetBody'), sheetTitle = $('#sheetTitle');
  function openSheet(title, html) {
    sheetTitle.textContent = '新增' + title;
    sheetBody.innerHTML = html + `<button id="sheetSave" class="sheet-save">保存</button>`;
    sheet.classList.remove('hidden');
  }
  function closeSheet() { sheet.classList.add('hidden'); }
  sheet.addEventListener('click', e => { if (e.target.hasAttribute('data-close') || e.target.id === 'sheetSave') closeSheet(); });

  function buildTopicForm() {
    const popts = PLATFORMS.map(p => `<option>${p}</option>`).join('');
    const copts = CATS.map(c => `<option>${c}</option>`).join('');
    return `
      <div class="sheet-field"><label>平台<select id="f_platform">${popts}</select></label></div>
      <div class="sheet-field"><label>赛道分类<select id="f_cat">${copts}</select></label></div>
      <div class="sheet-field"><label>标题 / 选题<textarea id="f_title" rows="2" placeholder="爆款标题或你的选题"></textarea></label></div>
      <div class="sheet-field"><label>火爆核心原因 / 分析<textarea id="f_analysis" rows="2" placeholder="为什么火"></textarea></label></div>
      <div class="sheet-field"><label>抖音相关视频链接<input id="f_dy_link" placeholder="https://www.douyin.com/search/... 或具体视频链接" /></label></div>
      <div class="sheet-field"><label>B站相关链接<input id="f_bz_link" placeholder="https://search.bilibili.com/... 或 BV 链接" /></label></div>
    `;
  }
  function buildRepostForm() {
    const popts = PLATFORMS.map(p => `<option>${p}</option>`).join('');
    const copts = CATS.map(c => `<option>${c}</option>`).join('');
    return `
      <div class="sheet-field"><label>平台<select id="f_platform">${popts}</select></label></div>
      <div class="sheet-field"><label>标签/赛道<select id="f_tag">${copts}</select></label></div>
      <div class="sheet-field"><label>原爆款标题<textarea id="f_title" rows="2" placeholder="原视频标题"></textarea></label></div>
      <div class="sheet-field"><label>热度（如：抖音热点榜 772万）<input id="f_heat" placeholder="抖音热点榜 772万" /></label></div>
      <div class="sheet-field"><label>为什么适合你二创<textarea id="f_why_fit" rows="2" placeholder="契合你人设的原因"></textarea></label></div>
      <div class="sheet-field"><label>改编角度<textarea id="f_adapt_angle" rows="3" placeholder="具体怎么改"></textarea></label></div>
      <div class="sheet-field"><label>来源<input id="f_source" placeholder="抖音热点榜 2026-08-20" /></label></div>
      <div class="sheet-field"><label>这个视频长这样<textarea id="f_video_desc" rows="2" placeholder="原视频画面/结构描述"></textarea></label></div>
      <div class="sheet-field"><label>跳转链接<input id="f_link" placeholder="https://... 留空则跳平台搜索" /></label></div>
    `;
  }
  sheetBody.addEventListener('click', e => {
    if (e.target.id !== 'sheetSave') return;
    if (sheetTitle.textContent.includes('选题')) {
      userTopics.unshift({
        id: uid(), platform: $('#f_platform').value, cat: $('#f_cat').value,
        title: $('#f_title').value, analysis: $('#f_analysis').value,
        dy_link: $('#f_dy_link').value.trim() || 'https://www.douyin.com/search/' + encodeURIComponent($('#f_title').value),
        bz_link: $('#f_bz_link').value.trim() || 'https://search.bilibili.com/all?keyword=' + encodeURIComponent($('#f_title').value)
      });
      save(LS.user_topics, userTopics); renderTopics(); toast('选题已添加');
    } else if (sheetTitle.textContent.includes('二创')) {
      userReposts.unshift({
        id: uid(), platform: $('#f_platform').value, tag: $('#f_tag').value,
        title: $('#f_title').value, heat: $('#f_heat').value,
        why_fit: $('#f_why_fit').value, adapt_angle: $('#f_adapt_angle').value,
        source: $('#f_source').value, video_desc: $('#f_video_desc').value,
        link: $('#f_link').value.trim() || 'https://www.douyin.com/search/' + encodeURIComponent($('#f_title').value)
      });
      save(LS.user_reposts, userReposts); renderReposts(); toast('二创素材已添加');
    } else if (sheetTitle.textContent.includes('导入')) {
      importData($('#f_import') ? $('#f_import').value : '');
    }
    closeSheet();
  });

  /* ---------- 导入 ---------- */
  function importObj(d) {
    if (d && Array.isArray(d.topics)) {
      d.topics.forEach(t => userTopics.unshift({ id: uid(), ...t }));
      save(LS.user_topics, userTopics); renderTopics();
    }
    if (d && Array.isArray(d.reposts)) {
      d.reposts.forEach(t => userReposts.unshift({ id: uid(), ...t }));
      save(LS.user_reposts, userReposts); renderReposts();
    }
  }
  function importData(str) {
    try { importObj(JSON.parse(str)); toast('已导入今日采集'); }
    catch (e) { toast('JSON 解析失败，请检查格式'); }
  }
  function openImport() {
    openSheet('今日采集', `<div class="sheet-field"><label>把聊天里「瑜的工作台·今日采集」的 JSON 整段粘贴到这里（包含 topics / reposts 两项）：<textarea id="f_import" rows="9" placeholder='{"date":"2026-08-20","topics":[...],"reposts":[...]}'></textarea></label></div>`);
  }
  $('#topicImportBtn').addEventListener('click', openImport);
  $('#repostImportBtn').addEventListener('click', openImport);

  // 联网时拉取最新 daily.json
  fetch('./daily.json').then(r => r.ok ? r.json() : null).then(d => {
    if (d && d.date && daily.date && d.date !== daily.date) {
      daily = { date: d.date, topics: d.topics || [], reposts: d.reposts || [] };
      hidden = []; save(LS.daily, daily); save(LS.hidden, hidden);
      renderTopics(); renderReposts();
      toast('已更新到 ' + d.date + ' 采集');
    }
  }).catch(() => {});

  /* ---------- 视图切换 ---------- */
  const titles = { plan: '每日计划', topic: '选题每日灵感', repost: '爆款热点视频/二创', review: '内容复盘' };
  function switchView(v) {
    $$('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
    $$('[data-panel]').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== v));
    $('#viewTitle').textContent = titles[v];
  }
  $$('.nav-btn').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));

  /* ---------- 初始化 ---------- */
  $('#todayDate').textContent = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
  renderTopicFilter(); renderTopics();
  renderRepostFilter(); renderReposts();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
})();

  </script>
</body>
</html>
